name: Update AWS bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-bootstrap
  cancel-in-progress: false

jobs:
  update:
    name: Update bootstrap stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: infrastructure-production

    steps:
      - name: Checkout approved revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: test -n "$AWS_ROLE_ARN"

      - name: Get short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: codehawks-bootstrap-${{ github.run_id }}

      - name: Update versioned bootstrap stack
        shell: bash
        run: |
          set -euo pipefail

          # Use UpdateStack directly so this workflow can bootstrap permissions
          # used internally by the higher-level `aws cloudformation deploy` command.
          set +e
          update_output="$(
            aws cloudformation update-stack \
              --template-body file://infrastructure/bootstrap/template.yaml \
              --stack-name codehawks-bootstrap \
              --capabilities CAPABILITY_NAMED_IAM \
              2>&1
          )"
          update_status=$?
          set -e

          if (( update_status != 0 )); then
            if [[ "$update_output" == *"No updates are to be performed"* ]]; then
              echo "The bootstrap stack is already up to date."
              exit 0
            fi

            echo "$update_output" >&2
            exit "$update_status"
          fi

          echo "$update_output"
          aws cloudformation wait stack-update-complete \
            --stack-name codehawks-bootstrap

      - name: Verify deployed OIDC provider permissions
        shell: bash
        run: |
          set -euo pipefail

          readonly expected_account="394270749442"
          readonly role_name="codehawks-infrastructure-apply"
          readonly policy_name="ManageCodeHawksInfrastructure"

          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"

          [[ "$actual_account" == "$expected_account" ]]
          [[ "$caller_arn" == "arn:aws:sts::${expected_account}:assumed-role/${role_name}/"* ]]

          allows_oidc_list() {
            jq -e '
              def as_array: if type == "array" then . else [.] end;
              any(
                .Statement[];
                .Effect == "Allow"
                and ((.Action | as_array | index("iam:ListOpenIDConnectProviders")) != null)
                and ((.Resource | as_array | index("*")) != null)
              )
            ' >/dev/null
          }

          inline_policy="$(
            aws iam get-role-policy \
              --role-name "$role_name" \
              --policy-name "$policy_name" \
              --query PolicyDocument \
              --output json
          )"
          allows_oidc_list <<<"$inline_policy"

          boundary_arn="$(
            aws iam get-role \
              --role-name "$role_name" \
              --query 'Role.PermissionsBoundary.PermissionsBoundaryArn' \
              --output text
          )"
          boundary_version="$(
            aws iam get-policy \
              --policy-arn "$boundary_arn" \
              --query 'Policy.DefaultVersionId' \
              --output text
          )"
          boundary_policy="$(
            aws iam get-policy-version \
              --policy-arn "$boundary_arn" \
              --version-id "$boundary_version" \
              --query 'PolicyVersion.Document' \
              --output json
          )"
          allows_oidc_list <<<"$boundary_policy"

          # This call proves the effective intersection of the role policy and
          # its permissions boundary permits the Terraform provider data source.
          aws iam list-open-id-connect-providers >/dev/null
