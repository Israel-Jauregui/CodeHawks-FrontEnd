name: Update AWS bootstrap

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type update-codehawks-bootstrap to confirm this owner-admin action
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-bootstrap
  cancel-in-progress: false

jobs:
  update:
    name: Update bootstrap stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: bootstrap-production

    steps:
      - name: Checkout approved revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_BOOTSTRAP_ROLE_ARN: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          AWS_BOOTSTRAP_SERVICE_ROLE_ARN: ${{ vars.AWS_BOOTSTRAP_SERVICE_ROLE_ARN }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "update-codehawks-bootstrap" ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_BOOTSTRAP_ROLE_ARN" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/codehawks-bootstrap-update" ]]
          [[ "$AWS_BOOTSTRAP_SERVICE_ROLE_ARN" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/codehawks-bootstrap-cloudformation" ]]

      - name: Validate bootstrap policy invariants
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.53.3
          cfn-lint infrastructure/bootstrap/template.yaml
          python infrastructure/bootstrap/check_policy_invariants.py

      - name: Get short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: codehawks-bootstrap-${{ github.run_id }}

      - name: Update versioned bootstrap stack
        shell: bash
        env:
          AWS_BOOTSTRAP_SERVICE_ROLE_ARN: ${{ vars.AWS_BOOTSTRAP_SERVICE_ROLE_ARN }}
        run: |
          set -euo pipefail

          # Use UpdateStack directly so this workflow can bootstrap permissions
          # used internally by the higher-level `aws cloudformation deploy` command.
          set +e
          update_output="$(
            aws cloudformation update-stack \
              --template-body file://infrastructure/bootstrap/template.yaml \
              --stack-name codehawks-bootstrap \
              --role-arn "$AWS_BOOTSTRAP_SERVICE_ROLE_ARN" \
              --capabilities CAPABILITY_NAMED_IAM \
              2>&1
          )"
          update_status=$?
          set -e

          if (( update_status != 0 )); then
            if [[ "$update_output" == *"No updates are to be performed"* ]]; then
              echo "The bootstrap stack is already up to date."
              exit 0
            fi

            echo "$update_output" >&2
            exit "$update_status"
          fi

          echo "$update_output"
          aws cloudformation wait stack-update-complete \
            --stack-name codehawks-bootstrap

      - name: Verify deployed bootstrap separation
        shell: bash
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          readonly role_name="codehawks-infrastructure-apply"
          readonly policy_name="ManageCodeHawksInfrastructure"
          readonly boundary_arn="arn:aws:iam::${EXPECTED_ACCOUNT}:policy/codehawks-infrastructure-boundary"
          readonly routine_role_arn="arn:aws:iam::${EXPECTED_ACCOUNT}:role/${role_name}"
          readonly frontend_role_arn="arn:aws:iam::${EXPECTED_ACCOUNT}:role/codehawks-frontend-deploy"
          readonly stack_arn="arn:aws:cloudformation:us-east-1:${EXPECTED_ACCOUNT}:stack/codehawks-bootstrap/*"

          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"

          [[ "$actual_account" == "$EXPECTED_ACCOUNT" ]]
          [[ "$caller_arn" == "arn:aws:sts::${EXPECTED_ACCOUNT}:assumed-role/codehawks-bootstrap-update/"* ]]

          has_explicit_deny() {
            local action="$1"
            local resource="$2"
            jq -e --arg action "$action" --arg resource "$resource" '
              def as_array: if type == "array" then . else [.] end;
              any(
                .Statement[];
                .Effect == "Deny"
                and ((.Action | as_array | index($action)) != null)
                and ((.Resource | as_array | index($resource)) != null)
              )
            ' >/dev/null
          }

          rejects_control_plane_allows() {
            jq -e '
              def as_array: if type == "array" then . else [.] end;
              [
                .Statement[]
                | select(.Effect == "Allow")
                | .Action
                | as_array[]
                | select(
                    . == "iam:CreatePolicyVersion"
                    or . == "iam:DeletePolicyVersion"
                    or . == "iam:SetDefaultPolicyVersion"
                    or . == "iam:DeleteRolePermissionsBoundary"
                    or . == "iam:PassRole"
                    or . == "cloudformation:UpdateStack"
                  )
              ]
              | length == 0
            ' >/dev/null
          }

          inline_policy="$(
            aws iam get-role-policy \
              --role-name "$role_name" \
              --policy-name "$policy_name" \
              --query PolicyDocument \
              --output json
          )"
          rejects_control_plane_allows <<<"$inline_policy"
          has_explicit_deny "iam:PutRolePolicy" "$routine_role_arn" <<<"$inline_policy"
          has_explicit_deny "iam:CreatePolicyVersion" "$boundary_arn" <<<"$inline_policy"
          has_explicit_deny "iam:DeleteRolePermissionsBoundary" "$frontend_role_arn" <<<"$inline_policy"
          has_explicit_deny "cloudformation:UpdateStack" "$stack_arn" <<<"$inline_policy"

          attached_boundary_arn="$(
            aws iam get-role \
              --role-name "$role_name" \
              --query 'Role.PermissionsBoundary.PermissionsBoundaryArn' \
              --output text
          )"
          [[ "$attached_boundary_arn" == "$boundary_arn" ]]
          boundary_version="$(
            aws iam get-policy \
              --policy-arn "$boundary_arn" \
              --query 'Policy.DefaultVersionId' \
              --output text
          )"
          boundary_policy="$(
            aws iam get-policy-version \
              --policy-arn "$boundary_arn" \
              --version-id "$boundary_version" \
              --query 'PolicyVersion.Document' \
              --output json
          )"
          rejects_control_plane_allows <<<"$boundary_policy"
          has_explicit_deny "iam:PutRolePolicy" "$routine_role_arn" <<<"$boundary_policy"
          has_explicit_deny "iam:CreatePolicyVersion" "$boundary_arn" <<<"$boundary_policy"
          has_explicit_deny "iam:DeleteRolePermissionsBoundary" "$frontend_role_arn" <<<"$boundary_policy"
          has_explicit_deny "cloudformation:UpdateStack" "$stack_arn" <<<"$boundary_policy"
