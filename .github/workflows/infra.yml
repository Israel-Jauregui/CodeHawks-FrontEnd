name: Deploy infrastructure

# Run by hand after an infrastructure change has merged to main. The first job shows what
# would change (cdk diff) with a read-only role. The second waits for approval in the
# `infrastructure` environment, then runs cdk deploy.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  diff:
    name: Show changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infrastructure-plan
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/swe-site-infra-plan
          role-session-name: gha-infra-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk diff
        run: |
          set -o pipefail
          npx cdk diff --all --no-change-set --no-color 2>&1 | tee diff.txt
          { echo '```'; cat diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: diff
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/swe-site-infra
          role-session-name: gha-infra-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      # CloudFormation keeps the BudgetEmail parameter from the first deploy.
      - run: npx cdk deploy --all --require-approval never --no-color
