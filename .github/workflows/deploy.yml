name: Deploy site

# workflow_run is safe here: the job only runs for successful `push` runs of
# ci.yml on main in this repository, never checks out code, and re-verifies the
# source run through the API before downloading its artifact.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: ID of a successful CI run on main whose artifact to deploy (rollback)
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The approval gate. Its variables come from the SweSite stack's outputs.
    environment:
      name: production
      url: https://codehawks.org/
    permissions:
      actions: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
      BUCKET: ${{ vars.S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      # Deploy only an artifact built by ci.yml from a push to main in this repo.
      - name: Verify source CI run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::ci_run_id must be numeric"; exit 1; }
          run="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          jq -e --arg repo "$REPO" '
            .path == ".github/workflows/ci.yml" and .event == "push" and
            .head_branch == "main" and .conclusion == "success" and
            .head_repository.full_name == $repo' <<<"$run" >/dev/null \
            || { echo "::error::Run $RUN_ID is not a successful CI push to main."; exit 1; }
          echo "Deploying $(jq -r .head_sha <<<"$run") from CI run ${RUN_ID}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check deployment settings
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::Set AWS_ACCOUNT_ID in the production environment"; exit 1; }
          [[ "$BUCKET" == "swe-site-${AWS_ACCOUNT_ID}" ]] || { echo "::error::S3_BUCKET is not this site's bucket"; exit 1; }
          [[ "$DISTRIBUTION_ID" =~ ^E[A-Z0-9]{9,19}$ ]] || { echo "::error::Set CLOUDFRONT_DISTRIBUTION_ID in the production environment"; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Check artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          ls dist/assets/*.js >/dev/null

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/swe-site-deploy
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish
        run: |
          # 1. Hashed assets first. Old ones stay so open tabs keep working.
          aws s3 sync dist/assets "s3://$BUCKET/assets" --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"
          # 2. Photos, icons and the other public files at a moderate TTL.
          aws s3 sync dist "s3://$BUCKET" --only-show-errors --delete \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public, max-age=3600"
          # 3. index.html last, so it never references assets that are not uploaded yet.
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --only-show-errors \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

          inv="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$inv"
          echo "Published (invalidation $inv)" >> "$GITHUB_STEP_SUMMARY"
