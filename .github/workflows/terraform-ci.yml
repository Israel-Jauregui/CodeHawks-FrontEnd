name: Terraform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.12.2"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate CloudFront request routing
        run: node functions/request-router.test.cjs

      - name: Validate Email Routing safeguards
        run: python3 -m unittest discover -s email-routing -p 'test_*.py'

      - name: Validate CloudFormation bootstrap
        run: |
          python3 -m pip install --disable-pip-version-check cfn-lint==1.53.3
          cfn-lint bootstrap/template.yaml
          python3 bootstrap/check_policy_invariants.py

      - name: Initialize without remote state
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate
