name: Apply infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

jobs:
  apply:
    name: Apply production infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infrastructure-production
    defaults:
      run:
        working-directory: infrastructure
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_budget_alert_email: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAIL }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_enable_flat_rate_waf: ${{ vars.ENABLE_FLAT_RATE_WAF }}
      TF_VAR_ses_dkim_tokens: ${{ vars.SES_DKIM_TOKENS }}

    steps:
      - name: Checkout approved revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.12.2"

      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$AWS_ROLE_ARN"
          test -n "$TF_STATE_BUCKET"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$TF_VAR_budget_alert_email"
          test -n "$TF_VAR_cloudflare_zone_id"
          test -n "$TF_VAR_ses_dkim_tokens"
          jq -e 'type == "array" and length == 3 and all(.[]; type == "string" and test("^[a-z0-9]+$"))' \
            <<<"$TF_VAR_ses_dkim_tokens" >/dev/null

      - name: Get short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: codehawks-terraform-${{ github.run_id }}

      - name: Initialize remote state
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Plan
        run: terraform plan -input=false -out=production.tfplan

      - name: Apply
        run: terraform apply -input=false -auto-approve production.tfplan

      - name: Publish deployment values
        run: terraform output
