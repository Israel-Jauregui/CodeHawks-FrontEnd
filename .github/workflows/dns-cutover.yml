name: Point codehawks.org at a distribution

# One-off for the 2026-11-17 cutover, removed once it has run. It changes only the target of the
# two CNAME records, codehawks.org and www.codehawks.org, in Cloudflare. It runs in the
# `infrastructure` environment, so it waits for the owner's approval and can read CLOUDFLARETOKEN.
on:
  workflow_dispatch:
    inputs:
      target:
        description: The CloudFront hostname both records should point at (SweSite's DistributionDomainName output)
        required: true
        type: string

permissions: {}

jobs:
  dns:
    name: Update the two CNAME records
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: infrastructure
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARETOKEN }}
      # Passed through the environment, never into the script text, and checked before use.
      TARGET: ${{ inputs.target }}
      ZONE_ID: abfc6de9e94de18f52549be8f7cb7dca # codehawks.org
    steps:
      - name: Update records
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^d[a-z0-9]+\.cloudfront\.net$ ]] || { echo "::error::target must be a cloudfront.net hostname"; exit 1; }
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          for name in codehawks.org www.codehawks.org; do
            records="$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=$name")"
            [[ "$(jq '.result | length' <<<"$records")" == 1 ]] || { echo "::error::expected exactly one CNAME named $name"; exit 1; }
            [[ "$(jq -r '.result[0].proxied' <<<"$records")" == false ]] || { echo "::error::$name is proxied; it must be DNS only"; exit 1; }
            id="$(jq -r '.result[0].id' <<<"$records")"
            before="$(jq -r '.result[0].content' <<<"$records")"
            after="$(api -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$id" --data "$(jq -n --arg c "$TARGET" '{content: $c}')" | jq -r '.result.content')"
            echo "$name: $before -> $after" | tee -a "$GITHUB_STEP_SUMMARY"
          done
