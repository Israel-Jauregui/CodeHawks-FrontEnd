name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    # Branch protection on main requires a check with exactly this name.
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache: this job produces the deployable artifact.
          package-manager-cache: false

      - run: npm ci
      - run: npm run lint
      # Builds (type-check, bundle, prerender), then checks the content and the built page.
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev

      # Only main builds are deployable. Kept 30 days, which is the rollback window.
      - name: Upload site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  infra:
    name: Infrastructure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Offline: no credentials. Proves the app still produces CloudFormation templates.
      - run: npm run synth
